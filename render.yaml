services:
  - type: web
    name: control-servicio-backend
    runtime: node
    plan: free
    rootDir: app/backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_IDLE_MINUTES
        value: "10"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: SEED_ADMIN_DOCUMENTO
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
